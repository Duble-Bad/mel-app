<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão · MEL</title>
<style>
  /* Página estática servida pelo service worker: cores espelham os tokens do Design System (background, text-primary, text-secondary, primary). */
  :root { --bg: #fbfaf7; --fg: #18212f; --muted: #667085; --cta: #875215; --cta-fg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #f7f4ee; --muted: #b8c0cc; --cta: #dfa33b; --cta-fg: #0d1117; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  img { width: 64px; height: 64px; border-radius: 26%; }
  h1 { margin: 0; font-size: 1.5rem; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--cta); color: var(--cta-fg); font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/brand/app-icon-192.png" alt="">
  <h1>Você está sem conexão</h1>
  <p>Assim que a internet voltar, a MEL continua de onde parou. Se estiver procurando um pet, anote onde e quando o viu.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
